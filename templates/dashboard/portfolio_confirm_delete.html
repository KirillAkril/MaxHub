{% extends "base.html" %}
{% block title %}Удалить проект{% endblock %}
{% block content %}
<h2>Удалить проект</h2>
<div class="card glassy">
    <div class="card-body">
        <p>Вы уверены, что хотите удалить проект <strong>"{{ object.title }}"</strong>?</p>
        <p class="text-muted">Это действие нельзя отменить.</p>
        <form method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'portfolio_edit' object.pk %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
